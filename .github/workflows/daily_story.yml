name: Daily Audio Drama Pipeline

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      series_type:
        description: "Ma chu de (trong_sinh, doi_thuong, hoac slug tuy chon)"
        required: true
        default: "trong_sinh"
      custom_topic:
        description: "Chu de goi y rieng (bo trong de AI tu quet trend)"
        required: false
        default: ""
      privacy_status:
        description: "Che do dang YouTube"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
  repository_dispatch:
    types: [generate_episode]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "thumb/package.json"

      - name: Cai FFmpeg va Font tieng Viet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Cai thu vien Python
        run: pip install -q -r requirements.txt

      - name: Cai Satori render thumbnail
        working-directory: thumb
        run: npm install --silent

      - name: Chay pipeline v3 Studio Pro + Trend Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ASSETS_RELEASE_TAG: "assets"
          EPISODES_PER_BOOK: "5"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL }}
          WATERMARK_URL: "https://i.ibb.co/s91HtYWs/IMG-2119.jpg"
          TIKTOK_DURATION: "75"
          YOUTUBE_CHANNEL_URL: "https://youtube.com/@truonghoang-om2cf"
          TIKTOK_CHANNEL_URL: "https://www.tiktok.com/@scvpro11"
          WORKER_SYNC_URL: "https://tele.scvpro748.workers.dev"
          SERIES_TYPE: ${{ github.event.inputs.series_type || github.event.client_payload.series_type || 'trong_sinh' }}
          SERIES_NAME: ${{ github.event.client_payload.series_name || '' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || github.event.client_payload.custom_topic || '' }}
          START_NEW_BOOK: ${{ github.event.client_payload.start_new_book || 'false' }}
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy_status || github.event.client_payload.privacy_status || 'public' }}
        run: python src/main.py

      - name: Luu lai bo nho cot truyen vao repo
        run: |
          git config user.name "clipngan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/story_memory.json
          git diff --staged --quiet || git commit -m "chore: cap nhat story_memory sau tap moi"
          git push
